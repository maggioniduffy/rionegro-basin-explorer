[project]
name = "flowwater"
version = "0.1.0"
description = "pipeline:flow-water, water network of the flow sections from Sentinel-2 and Copernicus GLO-30"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "skan",
  "networkx",
  "rasterio",
  "pyproj",
  "shapely",
  "pystac-client",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
flowwater = "flowwater.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowwater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
