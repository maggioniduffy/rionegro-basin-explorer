name: flow-water

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region id (required)
        required: true
        type: string
      only:
        description: Comma-separated ids/ranges, as pipeline:flow-water --only
        required: false
        type: string
      rivers:
        description: Comma-separated river slugs, as pipeline:flow-water --rivers
        required: false
        type: string
      chunk:
        description: Sections per matrix job
        required: true
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      only: ${{ steps.matrix.outputs.only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore published flow sections
        run: npm run content:pull -- --region "$REGION" --kind flow
        env:
          REGION: ${{ inputs.region }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CONTENT_BUCKET: basin-content
      - id: matrix
        env:
          REGION: ${{ inputs.region }}
          ONLY: ${{ inputs.only }}
          RIVERS: ${{ inputs.rivers }}
          CHUNK: ${{ inputs.chunk }}
        run: |
          set -euo pipefail
          if [ -z "$ONLY" ] && [ -z "$RIVERS" ]; then
            echo "Set only or rivers: refusing an accidental full run" >&2
            exit 1
          fi
          matrix="$(npm run --silent flow-water:plan -- --region "$REGION" --only "$ONLY" --rivers "$RIVERS" --chunk "$CHUNK")"
          only="$(printf '%s' "$matrix" | jq -r '[.include[].only] | join(",")')"
          if [ -z "$only" ]; then
            echo "Selection is empty" >&2
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "only=$only" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: uv sync --project pipeline/py --frozen
      - run: npm run content:pull -- --region "$REGION" --kind flow
        env:
          REGION: ${{ inputs.region }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CONTENT_BUCKET: basin-content
      - run: npm run flow-water:sync -- --region "$REGION" --mode pull --only "$ONLY"
        env:
          REGION: ${{ inputs.region }}
          ONLY: ${{ matrix.only }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PIPELINE_BUCKET: basin-pipeline
      - run: npm run pipeline:flow-water -- --region "$REGION" --only "$ONLY"
        env:
          REGION: ${{ inputs.region }}
          ONLY: ${{ matrix.only }}
      - run: npm run flow-water:sync -- --region "$REGION" --mode push --only "$ONLY"
        if: always()
        env:
          REGION: ${{ inputs.region }}
          ONLY: ${{ matrix.only }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PIPELINE_BUCKET: basin-pipeline

  publish:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: uv sync --project pipeline/py --frozen
      - run: npm run content:pull -- --region "$REGION" --kind flow
        env:
          REGION: ${{ inputs.region }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CONTENT_BUCKET: basin-content
      - run: npm run flow-water:sync -- --region "$REGION" --mode collect
        env:
          REGION: ${{ inputs.region }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PIPELINE_BUCKET: basin-pipeline
      # Rebuilds data/work/<region>/flow-water/report.json (needed by the net gate) from the
      # collected out/*.report.json, without processing or downloading scenes.
      - run: npm run pipeline:flow-water -- --region "$REGION" --report-only
        env:
          REGION: ${{ inputs.region }}
      - run: npm run pipeline:flow-net-publish -- --region "$REGION"
        env:
          REGION: ${{ inputs.region }}
      - run: npm run content:publish -- --region "$REGION" --kind flow
        env:
          REGION: ${{ inputs.region }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CONTENT_BUCKET: basin-content
      - name: Write PR body
        env:
          REGION: ${{ inputs.region }}
          RUN_ID: ${{ github.run_id }}
          PLANNED: ${{ needs.plan.outputs.only }}
        run: |
          set -euo pipefail
          {
            echo "Published flow networks from workflow run $RUN_ID (region $REGION)."
            echo
            echo "Planned sections: $(printf '%s' "$PLANNED" | tr ',' '\n' | grep -c .)"
            echo
            echo "flow-net-publish:"
            jq -r '"- ok: \(.ok), candidates: \(.candidates), published: \(.published), rejected: \(.rejected), bytes: \(.bytes)"' "data/work/$REGION/flow-net-publish/report.json"
            echo "flow-water:"
            jq -r '"- ok: \(.ok), sections: \(.totals.sections), failed: \(.totals.failed), warnings: \(.totals.warnings)"' "data/work/$REGION/flow-water/report.json"
            echo "content-publish:"
            jq -r '"- uploaded: \(.uploaded), skipped: \(.skipped), bytes: \(.bytes)"' "data/work/$REGION/content-publish/report.json"
          } > "$RUNNER_TEMP/pr-body.md"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: b1-nets-${{ github.run_id }}
          title: "flow-water ${{ inputs.region }} (${{ github.run_id }})"
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: "Publish flow-water networks for ${{ inputs.region }}"
          add-paths: content/versions.json
